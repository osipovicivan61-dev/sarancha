<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>KindAi Pro · SD 2 Fast</title>
<style>
  body{background:#0b1020;color:#dbe4ff;font-family:Segoe UI,system-ui,sans-serif;margin:0;padding:28px;line-height:1.5}
  h1{font-size:22px;margin:0 0 4px}.sub{color:#6f7ea8;margin-bottom:18px}
  .card{background:#121936;border:1px solid #22305e;border-radius:12px;padding:16px 18px;margin:12px 0}
  label{display:block;color:#7aa2ff;font-size:13px;margin:10px 0 4px}
  textarea,input,select{background:#0a1128;border:1px solid #22305e;border-radius:8px;color:#dbe4ff;padding:9px 11px;font-size:14px;width:100%;box-sizing:border-box}
  textarea{min-height:72px;resize:vertical}
  button{background:#1d4ed8;color:#fff;border:0;border-radius:10px;padding:11px 24px;font-size:15px;cursor:pointer}
  button:disabled{background:#334155;cursor:default}
  .row{display:flex;gap:12px}.row>div{flex:1}
  #log{font-family:Consolas,monospace;font-size:13px;white-space:pre-wrap;max-height:300px;overflow:auto;background:#0a1128;border-radius:8px;padding:12px;border:1px solid #22305e}
  .ok{color:#4ade80}.err{color:#f87171}.wait{color:#fbbf24}.dim{color:#6f7ea8}
  video{width:100%;max-width:760px;border-radius:10px;margin-top:8px}
  #done a{color:#4ade80}
  .tag{font-size:12px;padding:2px 8px;border-radius:20px;background:#0d2440;color:#7aa2ff;margin-left:8px}
  .radios{display:flex;gap:16px;margin-top:6px}
  .radios label{display:flex;align-items:center;gap:6px;margin:0;color:#dbe4ff;font-size:14px}
</style>
</head>
<body>

<h1>SD 2 Fast — генерация</h1>
<div class="sub">всё в этом окне</div>

<div class="card">
  <label>Промпт</label>
  <textarea id="prompt">A cinematic drone shot of a snowy mountain at sunrise, warm light</textarea>

  <label>Референсы — фото</label>
  <input type="file" id="imgs" accept="image/*" multiple>

  <label>Референсы — видео</label>
  <input type="file" id="vids" accept="video/*" multiple>

  <label>Референсы — аудио</label>
  <input type="file" id="auds" accept="audio/*" multiple>

  <div class="row">
    <div>
      <label>Длительность (сек)</label>
      <input id="dur" type="number" min="4" max="15" value="4">
    </div>
    <div>
      <label>Формат</label>
      <select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select>
    </div>
    <div>
      <label>Режим</label>
      <div class="radios">
        <label><input type="radio" name="fast" value="fast" checked> Fast</label>
        <label><input type="radio" name="fast" value="mini"> Mini</label>
      </div>
    </div>
  </div>

  <p style="margin:14px 0 4px">
    <button id="go">Сгенерировать</button>
  </p>
  <div id="error" style="display:none;color:#f87171;font-size:13px;margin-top:6px"></div>
</div>

<div class="card" id="doneCard" style="display:none">
  <b>Готовое видео</b>
  <div id="done"></div>
</div>

<script>
const S = "/proxy/seed";
let cancelled = false;

function log(){}
function step(){} 
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function rnd(n){ const a="abcdefghijklmnopqrstuvwxyz0123456789"; let s=""; for(let i=0;i<n;i++) s+=a[Math.random()*a.length|0]; return s; }

async function seed(path, method="GET", body=null, form=false, token=null){
  const h={};
  let data=null;
  if(body!==null){
    if(form){ data=new URLSearchParams(body); h["Content-Type"]="application/x-www-form-urlencoded"; }
    else { data=JSON.stringify(body); h["Content-Type"]="application/json"; }
  }
  if(token) h["Authorization"]="Bearer "+token;
  const r=await fetch(S+"/"+path.replace(/^\//,""), {method, headers:h, body:data});
  let j=null; try{ j=await r.json(); }catch(e){ j={raw:true}; }
  return {status:r.status, body:j};
}

// ── почта: temp-mail, иначе mail.tm ────────────────────────
async function tmpRpc(method, params){
  const r=await fetch("/proxy/tmp/", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({jsonrpc:"2.0", method, params, id:1})});
  return r.json();
}
async function tempMail(){
  const ots=await tmpRpc("user.create_ots",{});
  const sid=await tmpRpc("user.get_sid",{ots: ots.result && ots.result.ots});
  if(!sid.result || !sid.result.sid) throw new Error("temp-mail: "+JSON.stringify(sid.error||sid).slice(0,120));
  const s=sid.result.sid;
  const doms=await tmpRpc("getdomains",{sid:s});
  const list=(doms.result && (doms.result.domains||doms.result)) || [];
  const domain=(Array.isArray(list)?list[0]:null) || "temp-mail.org";
  const addr=rnd(10)+"@"+domain;
  await tmpRpc("mailbox.new",{sid:s, email:addr});
  return {addr, kind:"temp-mail", sid:s};
}
async function mailTm(){
  const r=await fetch("/proxy/tm/domains"); const j=await r.json();
  const domain=j["hydra:member"][0].domain;
  const addr=rnd(10)+"@"+domain;
  const pw=rnd(12)+"A1";
  await fetch("/proxy/tm/accounts",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({address:addr,password:pw})});
  const auth=await fetch("/proxy/tm/token",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({address:addr,password:pw})}).then(r=>r.json());
  return {addr, kind:"mail.tm", token:auth.token};
}
async function getMailbox(){
  try{ return await tempMail(); }
  catch(e){ log("temp-mail не дал ящик ("+e.message+"), пробую mail.tm…","err"); return await mailTm(); }
}

// ── сайт генерации ─────────────────────────────────────────
async function register(email){
  const name="user_"+rnd(6);
  const password="Qq"+rnd(10)+"1!";
  const r=await seed("api/auth/register","POST",{name, email, password});
  if(r.status!==201) throw new Error("регистрация: HTTP "+r.status+" "+JSON.stringify(r.body).slice(0,150));
  return {name, email, password, credits:(r.body.user||{}).credits};
}
async function login(email, password){
  const csrf=await seed("api/auth/csrf");
  const token=csrf.body && csrf.body.csrfToken;
  if(!token) throw new Error("нет csrf");
  const r=await seed("api/auth/callback/credentials","POST",
    {csrfToken:token, email, password, json:"true"}, true);
  if(r.status>=400) throw new Error("вход: HTTP "+r.status);
  const me=await seed("api/user");
  if(!me.body || !me.body.user) throw new Error("сессия не поднялась");
  return me.body.user;
}

async function pollMail(mailbox, timeoutSec){
  const deadline=Date.now()+timeoutSec*1000;
  while(Date.now()<deadline && !cancelled){
    let code=null;
    if(mailbox.kind==="mail.tm"){
      const r=await fetch("/proxy/tm/messages",{headers:{"Authorization":"Bearer "+mailbox.token}});
      const j=await r.json();
      const msgs=j["hydra:member"]||[];
      for(const m of msgs){
        const d=await fetch("/proxy/tm/messages/"+m.id,{headers:{"Authorization":"Bearer "+mailbox.token}}).then(r=>r.json());
        const text=(d.text||d.html&&d.html.join(" ")||"").toString();
        const mm=text.match(/\b\d{4,8}\b/);
        if(mm){ code=mm[0]; break; }
      }
    }else{
      const r=await tmpRpc("mail.get",{sid:mailbox.sid, mail:mailbox.addr});
      const list=(r.result && (r.result.mails||r.result)) || [];
      if(Array.isArray(list) && list.length){
        const m=list[0];
        const src=await tmpRpc("mail.source",{sid:mailbox.sid, mail:mailbox.addr, base64:false});
        const body=JSON.stringify(src.result||m);
        const mm=body.match(/\b\d{4,8}\b/);
        if(mm) code=mm[0];
      }
    }
    if(code) return code;
    await sleep(6000);
  }
  return null;
}

async function uploadRef(file){
  const fd=new FormData();
  fd.append("k","ae4f5b0c9d");
  fd.append("files[]", file, file.name);
  const r=await fetch("/proxy/uguu/", {method:"POST", body:fd});
  if(!r.ok) throw new Error("загрузка "+file.name+": HTTP "+r.status);
  const j=await r.json();
  const url=j.files && j.files[0] && j.files[0].url;
  if(!url) throw new Error("нет ссылки для "+file.name);
  return url;
}
async function collectRefs(){
  const out=[];
  const groups=[
    ["imgs","image","reference_image"],
    ["vids","video","reference_video"],
    ["auds","audio","reference_audio"],
  ];
  for(const [id,type,role] of groups){
    for(const f of document.getElementById(id).files){
      const url=await uploadRef(f);
      out.push({url, type, role});
    }
  }
  return out;
}

async function generate(user, prompt, dur, ratio, isFast, refUrls){
  const params={duration:dur, ratio};
  const body={model:"seedance2", prompt, params, isFast, generationMode:"text_to_video"};
  if(refUrls.length) body.referenceUrls=refUrls;
  const r=await seed("api/generations","POST",body);
  if(r.status!==201) throw new Error("генерация: HTTP "+r.status+" "+JSON.stringify(r.body).slice(0,250));
  const gen=r.body.generation||r.body;
  log("задача "+gen.id+" · кредитов: "+user.credits+" → "+((await seed("api/user")).body.user.credits),"ok");
  return gen.id;
}
async function waitVideo(id){
  const deadline=Date.now()+20*60*1000;
  let last="";
  while(Date.now()<deadline && !cancelled){
    const st=await seed(`api/generations/${id}/status`);
    const s=(st.body.status||"").toLowerCase();
    if(s!==last){ step("статус: "+s+(st.body.progress?" "+st.body.progress+"%":"")); last=s; }
    if(s==="completed"){
      const d=await seed(`api/generations/${id}`);
      const gen=d.body.generation||d.body;
      if(gen.resultUrl) return gen.resultUrl;
      throw new Error("completed, но нет resultUrl");
    }
    if(s==="failed") throw new Error("упало: "+(st.body.errorMessage||"?"));
    await sleep(4000);
  }
  throw new Error("не уложилось за 20 минут");
}

document.getElementById("go").onclick = async ()=>{
  const btn=document.getElementById("go");
  btn.disabled=true; btn.textContent="Генерация…"; cancelled=false;
  document.getElementById("error").style.display="none";
  document.getElementById("doneCard").style.display="none";
  document.getElementById("done").innerHTML="";
  try{
    const prompt=document.getElementById("prompt").value.trim();
    const dur=Math.max(4,Math.min(15,parseInt(document.getElementById("dur").value)||4));
    const ratio=document.getElementById("ratio").value;
    const isFast=document.querySelector('input[name=fast]:checked').value==="fast";

    const refUrls=await collectRefs();

    const mailbox=await getMailbox();

    const acc=await register(mailbox.addr);

    const user=await login(mailbox.addr, acc.password);

    const id=await generate(user, prompt, dur, ratio, isFast, refUrls);
    const url=await waitVideo(id);
    const wrap=document.getElementById("done");
    wrap.innerHTML="";
    const v=document.createElement("video"); v.controls=true; v.autoplay=true; v.src=url;
    wrap.appendChild(v);
    const a=document.createElement("p");
    a.innerHTML=`<a href="${url}" target="_blank" download>скачать / открыть</a>`;
    wrap.appendChild(a);
    document.getElementById("doneCard").style.display="block";
  }catch(e){
    const err=document.getElementById("error");
    err.textContent="ошибка: "+e.message;
    err.style.display="block";
  }finally{
    btn.textContent="Сгенерировать";
    btn.disabled=false;
  }
};
</script>
</body>
</html>
